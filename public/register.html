<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - CultureRadar</title>
    <meta name="description" content="Creez votre compte CultureRadar gratuit et recevez vos recommandations culturelles personnalisees.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="cr-header-placeholder"></div>

    <main class="section">
        <div class="container" style="max-width: 600px;">
            <div class="card" style="padding: 2rem;">
                <div class="text-center mb-md">
                    <img src="/img/logo.png" alt="CultureRadar" width="72" height="72" style="display:block;margin:0 auto;">
                    <h1 style="font-size:1.75rem;margin-top:.5rem;">Creer un compte CultureRadar</h1>
                    <p class="muted">Rejoignez la communaute, c est gratuit en quelques secondes.</p>
                </div>

                <p class="small muted" style="margin-bottom:.5rem;">Type de compte</p>
                <div class="role-toggle mb-md">
                    <button type="button" class="role-btn active" data-role="user" onclick="setRole('user')">
                        <span class="role-emoji">👤</span>
                        <span class="role-name">Particulier</span>
                        <span class="role-desc small muted">Decouvrir et reserver</span>
                    </button>
                    <button type="button" class="role-btn" data-role="pro" onclick="setRole('pro')">
                        <span class="role-emoji">🎭</span>
                        <span class="role-name">Lieu / Organisateur</span>
                        <span class="role-desc small muted">Publier et promouvoir</span>
                    </button>
                </div>

                <form id="signup" autocomplete="on">
                    <div class="form-row">
                        <div class="form-group"><label for="prenom">Prenom</label><input type="text" id="prenom" autocomplete="given-name"></div>
                        <div class="form-group"><label for="nom">Nom *</label><input type="text" id="nom" required autocomplete="family-name"></div>
                    </div>
                    <div class="form-group"><label for="email">Email *</label><input type="email" id="email" required autocomplete="email"></div>
                    <div class="form-group">
                        <label for="password">Mot de passe * <span class="muted small">(min 6 caracteres)</span></label>
                        <input type="password" id="password" minlength="6" required autocomplete="new-password">
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label for="ville">Ville</label><input type="text" id="ville" autocomplete="address-level2" placeholder="Paris, Lyon..."></div>
                        <div class="form-group"><label for="code_postal">Code postal</label><input type="text" id="code_postal" autocomplete="postal-code"></div>
                    </div>
                    <div class="form-group">
                        <label class="filter-option" style="cursor:pointer;">
                            <input type="checkbox" id="newsletter" checked>
                            Recevoir la newsletter culturelle hebdomadaire
                        </label>
                        <label class="filter-option" style="cursor:pointer;">
                            <input type="checkbox" id="cgu" required>
                            J accepte les <a href="/legal.html" target="_blank">conditions d utilisation</a> et la <a href="/legal.html#rgpd" target="_blank">politique RGPD</a> *
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" id="signup-btn">Creer mon compte</button>
                </form>
                <div id="signup-error" class="alert alert-danger mt-md" style="display:none;"></div>
                <p class="muted text-center small mt-md">Deja un compte ? <a href="/login.html">Se connecter</a></p>
            </div>
        </div>
    </main>

    <div id="cr-footer-placeholder"></div>

    <style>
        .role-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
        .role-btn {
            background: var(--cr-bg-2); border: 2px solid var(--cr-border); border-radius: var(--cr-radius);
            padding: 1rem; cursor: pointer; text-align: center;
            display: flex; flex-direction: column; align-items: center; gap: .25rem;
            transition: all .15s; color: var(--cr-text);
        }
        .role-btn .role-emoji { font-size: 2rem; }
        .role-btn .role-name { font-weight: 700; }
        .role-btn:hover { border-color: var(--cr-primary); }
        .role-btn.active {
            background: linear-gradient(135deg, rgba(124,58,237,.1), rgba(236,72,153,.08));
            border-color: var(--cr-primary);
            box-shadow: 0 0 0 3px rgba(124,58,237,.15);
        }
        .role-btn.active .role-name { color: var(--cr-primary); }
        @media (max-width: 480px) { .role-toggle { grid-template-columns: 1fr; } }
    </style>

    <script src="/js/common.js"></script>
    <script>
        // Si deja connecte, rediriger
        if (CR.user() && CR.token()) {
            const u = CR.user();
            location.href = u.role === 'admin' ? '/admin.html' : u.role === 'pro' ? '/pro.html' : '/profile.html';
        }

        let role = new URLSearchParams(location.search).get('role') || 'user';
        if (!['user', 'pro'].includes(role)) role = 'user';

        function setRole(r) {
            role = r;
            document.querySelectorAll('[data-role]').forEach(el => el.classList.toggle('active', el.dataset.role === r));
        }
        window.setRole = setRole;
        setRole(role);

        document.getElementById('signup').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('signup-btn');
            const errEl = document.getElementById('signup-error');
            errEl.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Creation du compte...';
            try {
                const payload = {
                    email: document.getElementById('email').value.trim(),
                    password: document.getElementById('password').value,
                    nom: document.getElementById('nom').value.trim(),
                    prenom: document.getElementById('prenom').value.trim(),
                    role,
                    ville: document.getElementById('ville').value.trim() || null,
                    code_postal: document.getElementById('code_postal').value.trim() || null,
                    newsletter: document.getElementById('newsletter').checked
                };
                const loc = await CR.getLocation();
                if (loc) { payload.latitude = loc.lat; payload.longitude = loc.lng; }
                const data = await CR.post('/auth/register', payload);
                CR.setAuth(data.token, data.user);
                CR.toast('Compte cree. Bienvenue !', 'success');
                // B2C : onboarding pour personnaliser. B2B : direction espace pro.
                const dest = role === 'pro' ? '/pro.html' : '/onboarding.html';
                setTimeout(() => location.href = dest, 500);
            } catch (err) {
                errEl.textContent = err.message || 'Erreur lors de la creation';
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Creer mon compte';
            }
        });
    </script>
</body>
</html>
